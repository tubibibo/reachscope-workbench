name: workbench-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e ".[dev]"
      - run: npm ci
        working-directory: frontend
      - run: python scripts/check_all.py
      - run: python -m build --outdir artifacts/packages
      - name: Installed wheel smoke
        shell: python
        run: |
          import os,pathlib,subprocess,sys,tempfile,venv
          root=pathlib.Path.cwd()
          with tempfile.TemporaryDirectory() as temp:
              target=pathlib.Path(temp)
              venv.create(target/'venv',with_pip=True)
              python=target/'venv'/('Scripts/python.exe' if os.name=='nt' else 'bin/python')
              wheel=next((root/'artifacts/packages').glob('*.whl'))
              subprocess.run([str(python),'-m','pip','install',str(wheel),'httpx'],check=True)
              subprocess.run([str(python),str(root/'scripts/smoke/check_installed.py'),'--data',str(target/'workspace')],cwd=target,check=True)
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e ".[ui]"
      - run: npm ci
        working-directory: frontend
      - run: python scripts/quality/check_contracts.py
      - run: npm run build
        working-directory: frontend
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/quality/check_browser.py --out artifacts/validation/browser
      - name: Preserve local fixture browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: browser-local-fixtures
          path: artifacts/validation/browser
          retention-days: 7
